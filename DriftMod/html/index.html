<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift Control</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="drift-menu" class="menu-container">
        <!-- Header -->
        <div class="menu-header">
            <div class="header-content">
                <div class="title-section">
                    <i class="fas fa-car-side"></i>
                    <h1>Drift Control</h1>
                </div>
                <div class="status-section">
                    <div class="status-item">
                        <span class="status-label">Toggle</span>
                        <div id="toggle-status" class="status-indicator off">
                            <div class="status-dot"></div>
                            <span>OFF</span>
                        </div>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Hold</span>
                        <div id="hold-status" class="status-indicator off">
                            <div class="status-dot"></div>
                            <span>OFF</span>
                        </div>
                    </div>
                </div>
            </div>
            <button id="close-btn" class="close-btn">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Content -->
        <div class="menu-content">
            <!-- Controles de Drift -->
            <div class="section">
                <h2><i class="fas fa-sliders-h"></i> Controles de Drift</h2>
                
                <div class="control-group">
                    <label for="traction-max">Traction Curve Max</label>
                    <div class="slider-container">
                        <input type="range" id="fTractionCurveMax" min="0.01" max="1.0" step="0.01" value="0.1">
                        <div class="slider-value">
                            <span id="fTractionCurveMaxValue">0.1</span>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label for="traction-min">Traction Curve Min</label>
                    <div class="slider-container">
                        <input type="range" id="fTractionCurveMin" min="0.01" max="1.0" step="0.01" value="0.1">
                        <div class="slider-value">
                            <span id="fTractionCurveMinValue">0.1</span>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label for="traction-loss">Traction Loss Multiplier</label>
                    <div class="slider-container">
                        <input type="range" id="fTractionLossMult" min="1.0" max="10.0" step="0.1" value="5.0">
                        <div class="slider-value">
                            <span id="fTractionLossMultValue">5.0</span>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label for="steering-lock">Ângulo de Esterçamento</label>
                    <div class="slider-container">
                        <input type="range" id="fSteeringLock" min="30.0" max="60.0" step="0.5" value="45.0">
                        <div class="slider-value">
                            <span id="fSteeringLockValue">45.0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Presets -->
            <div class="section">
                <h2><i class="fas fa-magic"></i> Presets Rápidos</h2>
                <div class="presets-grid">
                    <button class="preset-btn light" data-preset="Iniciante" data-tooltip="Ideal para iniciantes. Oferece um drift mais controlado e fácil de manter.">
                        <i class="fas fa-graduation-cap"></i>
                        <span>Iniciante</span>
                        <small>Controle fácil</small>
                    </button>
                    <button class="preset-btn medium" data-preset="Competição" data-tooltip="Para competições. Exige mais habilidade para transições rápidas e ângulos agressivos.">
                        <i class="fas fa-trophy"></i>
                        <span>Competição</span>
                        <small>Performance</small>
                    </button>
                    <button class="preset-btn hard" data-preset="Showcase" data-tooltip="Configuração para shows e exibições. Drift extremamente agressivo.">
                        <i class="fas fa-star"></i>
                        <span>Showcase</span>
                        <small>Espetáculo</small>
                    </button>
                    <button class="preset-btn extreme" data-preset="Drift Extremo" data-tooltip="Drift ultra agressivo com controle mínimo. Apenas para experts!">
                        <i class="fas fa-fire"></i>
                        <span>Drift Extremo</span>
                        <small>Máxima derrapagem</small>
                    </button>
                    <button class="preset-btn smooth" data-preset="Drift Suave" data-tooltip="Drift suave e controlado, perfeito para manobras precisas.">
                        <i class="fas fa-feather"></i>
                        <span>Drift Suave</span>
                        <small>Controle preciso</small>
                    </button>
                    <button class="preset-btn pro" data-preset="Drift Profissional" data-tooltip="Configuração profissional balanceada para alta performance.">
                        <i class="fas fa-award"></i>
                        <span>Profissional</span>
                        <small>Alta performance</small>
                    </button>
                    <button class="preset-btn aggressive" data-preset="Drift Agressivo" data-tooltip="Drift agressivo com ângulos amplos e derrapagens longas.">
                        <i class="fas fa-bolt"></i>
                        <span>Agressivo</span>
                        <small>Ângulos amplos</small>
                    </button>
                    <button class="preset-btn controlled" data-preset="Drift Controlado" data-tooltip="Balanceamento perfeito entre controle e agressividade.">
                        <i class="fas fa-balance-scale"></i>
                        <span>Controlado</span>
                        <small>Equilibrado</small>
                    </button>
                </div>
            </div>

            <!-- Configurações -->
            <div class="section">
                <h2><i class="fas fa-cog"></i> Configurações</h2>
                
                <div class="setting-group">
                    <label for="toggle-key">Tecla de Toggle</label>
                    <button id="rebind-key" class="key-btn">
                        <i class="fas fa-keyboard"></i>
                        <span>K</span>
                        <small>Clique para alterar</small>
                    </button>
                </div>

                <div class="setting-group">
                    <label>Controles</label>
                    <div class="controls-info">
                        <div class="control-item">
                            <kbd>K</kbd>
                            <span>Toggle Drift</span>
                        </div>
                        <div class="control-item">
                            <kbd>SHIFT</kbd>
                            <span>Hold Drift</span>
                        </div>
                        <div class="control-item">
                            <kbd>M</kbd>
                            <span>Abrir/Fechar Menu</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ações -->
            <div class="section">
                <h2><i class="fas fa-undo"></i> Ações</h2>
                <div class="action-buttons">
                    <button id="reset-defaults" class="action-btn danger">
                        <i class="fas fa-undo"></i>
                        <span>Reset para Padrão</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="menu-footer">
            <div class="footer-info">
                <i class="fas fa-info-circle"></i>
                <span>Pressione M para abrir/fechar ou ESC para fechar</span>
            </div>
        </div>
    </div>

    <div id="tooltip" class="tooltip"></div>
    <script src="script.js"></script>
</body>
</html>
